<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback - AutoFlow</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 40px 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .feedback-container {
            max-width: 600px;
            width: 100%;
            background: white;
            border-radius: 20px;
            padding: 50px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        h1 {
            color: #667eea;
            text-align: center;
            margin-bottom: 15px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 40px;
        }

        .form-group {
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: #333;
        }

        input, textarea, select {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            min-height: 150px;
            resize: vertical;
        }

        .rating {
            display: flex;
            gap: 10px;
            justify-content: center;
            font-size: 2.5rem;
        }

        .rating span {
            cursor: pointer;
            transition: transform 0.2s;
            opacity: 0.3;
        }

        .rating span:hover,
        .rating span.active {
            transform: scale(1.2);
            opacity: 1;
        }

        .submit-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .submit-btn:hover {
            transform: translateY(-3px);
        }

        .success-message {
            display: none;
            text-align: center;
            padding: 30px;
        }

        .success-message.active {
            display: block;
        }

        .success-icon {
            font-size: 4rem;
            margin-bottom: 20px;
        }

        .feedback-type-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .type-btn {
            padding: 15px;
            border: 2px solid #e0e0e0;
            background: white;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }

        .type-btn:hover {
            border-color: #667eea;
        }

        .type-btn.active {
            border-color: #667eea;
            background: #f0f4ff;
        }

        .type-icon {
            font-size: 2rem;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
    <div class="feedback-container">
        <div id="feedback-form">
            <h1>We Value Your Feedback</h1>
            <p class="subtitle">Help us improve AutoFlow and serve you better</p>

            <form onsubmit="submitFeedback(event)">
                <div class="form-group">
                    <label>What type of feedback do you have?</label>
                    <div class="feedback-type-buttons">
                        <div class="type-btn" onclick="selectType(this, 'bug')">
                            <div class="type-icon">🐛</div>
                            <div>Bug Report</div>
                        </div>
                        <div class="type-btn" onclick="selectType(this, 'feature')">
                            <div class="type-icon">💡</div>
                            <div>Feature Request</div>
                        </div>
                        <div class="type-btn" onclick="selectType(this, 'general')">
                            <div class="type-icon">💬</div>
                            <div>General</div>
                        </div>
                    </div>
                    <input type="hidden" id="feedback-type" required>
                </div>

                <div class="form-group">
                    <label>How would you rate your experience?</label>
                    <div class="rating" id="rating">
                        <span onclick="setRating(1)">⭐</span>
                        <span onclick="setRating(2)">⭐</span>
                        <span onclick="setRating(3)">⭐</span>
                        <span onclick="setRating(4)">⭐</span>
                        <span onclick="setRating(5)">⭐</span>
                    </div>
                    <input type="hidden" id="rating-value" required>
                </div>

                <div class="form-group">
                    <label for="email">Your Email</label>
                    <input type="email" id="email" placeholder="you@example.com" required>
                </div>

                <div class="form-group">
                    <label for="message">Tell us more</label>
                    <textarea id="message" placeholder="Share your thoughts, report bugs, or suggest features..." required></textarea>
                </div>

                <button type="submit" class="submit-btn">Submit Feedback</button>
            </form>
        </div>

        <div id="success-message" class="success-message">
            <div class="success-icon">🎉</div>
            <h2>Thank You!</h2>
            <p style="margin: 20px 0; color: #666;">Your feedback has been received. We'll review it and get back to you soon.</p>
            <button class="submit-btn" onclick="resetForm()">Submit Another</button>
        </div>
    </div>

    <script>
        let selectedRating = 0;
        let selectedType = '';

        function selectType(element, type) {
            document.querySelectorAll('.type-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            element.classList.add('active');
            selectedType = type;
            document.getElementById('feedback-type').value = type;
        }

        function setRating(rating) {
            selectedRating = rating;
            document.getElementById('rating-value').value = rating;

            const stars = document.querySelectorAll('#rating span');
            stars.forEach((star, index) => {
                if (index < rating) {
                    star.classList.add('active');
                } else {
                    star.classList.remove('active');
                }
            });
        }

        async function submitFeedback(event) {
            event.preventDefault();

            const feedbackData = {
                type: document.getElementById('feedback-type').value,
                rating: parseInt(document.getElementById('rating-value').value),
                email: document.getElementById('email').value,
                message: document.getElementById('message').value
            };

            try {
                const response = await fetch('/api/feedback', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(feedbackData)
                });

                if (response.ok) {
                    document.getElementById('feedback-form').style.display = 'none';
                    document.getElementById('success-message').classList.add('active');

                    // Track feedback submission
                    if (typeof gtag !== 'undefined') {
                        gtag('event', 'feedback_submitted', {
                            'event_category': 'engagement',
                            'event_label': feedbackData.type
                        });
                    }
                } else {
                    alert('There was an error submitting your feedback. Please try again.');
                }
            } catch (error) {
                alert('There was an error submitting your feedback. Please try again.');
            }
        }

        function resetForm() {
            document.getElementById('feedback-form').style.display = 'block';
            document.getElementById('success-message').classList.remove('active');
            document.querySelector('form').reset();
            selectedRating = 0;
            selectedType = '';
            document.querySelectorAll('.type-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('#rating span').forEach(star => star.classList.remove('active'));
        }
    </script>
</body>
</html>
